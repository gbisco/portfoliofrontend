<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1600 900"
  preserveAspectRatio="xMidYMid slice"
>
  <defs>
    <linearGradient id="bluePlane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#83AEEA" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#315DAB" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#142A55" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="glassPlane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="50%" stop-color="#6E9FE8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B9D4F7" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#6E9FE8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect
    width="1600"
    height="900"
    fill="#070A12"
  />

  <!-- Main plane entering from top-left -->
  <path
    d="
      M 0 0
      L 950 0
      L 550 730
      L 0 900
      Z
    "
    fill="url(#bluePlane)"
  />

  <!-- Secondary glass plane -->
  <path
    d="
      M 0 0
      L 650 0
      L 360 600
      L 0 710
      Z
    "
    fill="url(#glassPlane)"
  />

  <!-- Subtle glass edge -->
  <path
    d="
      M 850 0
      L 500 650
      L 0 805
    "
    fill="none"
    stroke="url(#edge)"
    stroke-width="2"
  />
</svg>