<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 600"
  preserveAspectRatio="xMidYMid meet"
>
  <defs>
    <linearGradient id="resumate-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7562E8" />
      <stop offset="100%" stop-color="#5D4FC7" />
    </linearGradient>

    <linearGradient id="resumate-arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF4F58" />
      <stop offset="100%" stop-color="#FF5964" />
    </linearGradient>
  </defs>

  <!-- Main mark -->
  <rect
    x="90"
    y="90"
    width="420"
    height="420"
    rx="82"
    fill="url(#resumate-purple)"
  />

  <!-- Centered R -->
  <text
    x="300"
    y="380"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="285"
    font-weight="700"
    text-anchor="middle"
  >
    R
  </text>

  <!-- Smaller, slimmer northeast arrow -->
  <g
    fill="none"
    stroke="url(#resumate-arrow)"
    stroke-width="30"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M 410 455 L 480 385" />
    <path d="M 440 385 H 480 V 425" />
  </g>
</svg>