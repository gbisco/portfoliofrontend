<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1600 900"
  preserveAspectRatio="xMidYMid slice"
>
  <defs>
    <!-- Dark flowing surfaces -->
    <linearGradient
      id="surface"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#17131F"
      />

      <stop
        offset="55%"
        stop-color="#100D17"
      />

      <stop
        offset="100%"
        stop-color="#08080B"
      />
    </linearGradient>

    <!-- Resumate purple illuminated edges -->
    <linearGradient
      id="violetEdge"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#7562E8"
        stop-opacity="0"
      />

      <stop
        offset="35%"
        stop-color="#5D4FC7"
        stop-opacity="0.45"
      />

      <stop
        offset="70%"
        stop-color="#7562E8"
        stop-opacity="0.8"
      />

      <stop
        offset="100%"
        stop-color="#7562E8"
        stop-opacity="0"
      />
    </linearGradient>

    <!-- Soft illumination -->
    <filter
      id="softGlow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <!-- Base -->
  <rect
    width="1600"
    height="900"
    fill="#07070A"
  />

  <!-- Upper flowing surface -->
  <path
    d="
      M -100 70
      C 250 250, 390 310, 650 220
      C 920 125, 1060 20, 1700 190
      L 1700 0
      L -100 0
      Z
    "
    fill="url(#surface)"
  />

  <!-- Upper soft glow -->
  <path
    d="
      M -100 70
      C 250 250, 390 310, 650 220
      C 920 125, 1060 20, 1700 190
    "
    fill="none"
    stroke="url(#violetEdge)"
    stroke-width="22"
    opacity="0.35"
    filter="url(#softGlow)"
  />

  <!-- Upper sharp edge -->
  <path
    d="
      M -100 70
      C 250 250, 390 310, 650 220
      C 920 125, 1060 20, 1700 190
    "
    fill="none"
    stroke="url(#violetEdge)"
    stroke-width="2"
  />

  <!-- Lower flowing surface -->
  <path
    d="
      M -100 760
      C 230 550, 430 500, 690 610
      C 950 720, 1160 690, 1700 470
      L 1700 900
      L -100 900
      Z
    "
    fill="url(#surface)"
  />

  <!-- Lower soft glow -->
  <path
    d="
      M -100 760
      C 230 550, 430 500, 690 610
      C 950 720, 1160 690, 1700 470
    "
    fill="none"
    stroke="url(#violetEdge)"
    stroke-width="26"
    opacity="0.4"
    filter="url(#softGlow)"
  />

  <!-- Lower sharp edge -->
  <path
    d="
      M -100 760
      C 230 550, 430 500, 690 610
      C 950 720, 1160 690, 1700 470
    "
    fill="none"
    stroke="url(#violetEdge)"
    stroke-width="2"
  />
</svg>